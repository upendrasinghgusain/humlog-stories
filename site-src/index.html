<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f0d0b">
<title>Humlog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0f0d0b; --side: #15120f; --panel: #1d1915; --line: rgba(243,237,226,.10);
    --ink: #f3ede2; --ink-soft: rgba(243,237,226,.76); --ink-faint: rgba(243,237,226,.47);
    --amber: #d9a45b; --amber-soft: rgba(217,164,91,.15);
    --hi: "Tiro Devanagari Hindi", "Nirmala UI", "Mangal", serif;
    --en: "Cormorant Garamond", Georgia, serif;
    --ui: "Inter", system-ui, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font: 400 15px/1.45 var(--ui); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  [hidden] { display: none !important; }
  .unclear { border-bottom: 1px dotted var(--amber); }

  /* ---------------- the stage fills the screen ---------------- */
  .stage { position: fixed; inset: 0; background: #0b0908; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* top bar: menu button + where you are */
  .topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 8; display: flex; align-items: center; gap: 10px;
    padding: calc(10px + var(--safe-t)) 12px 10px; pointer-events: none;
    background: linear-gradient(rgba(11,9,8,.85), rgba(11,9,8,0)); }
  .topbar > * { pointer-events: auto; }
  .menu-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(29,25,21,.75);
    border: 1px solid var(--line); backdrop-filter: blur(6px); flex: none; }
  .menu-btn svg { width: 20px; height: 20px; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; fill: none; }
  .where { min-width: 0; flex: 1; }
  .fs-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(29,25,21,.75);
    border: 1px solid var(--line); backdrop-filter: blur(6px); flex: none; }
  .fs-btn svg { width: 18px; height: 18px; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  /* immersive mode (iPhone fallback): top bar fades away while playing, tap to show it again */
  body.immersive .topbar { opacity: 0; transition: opacity .6s; }
  body.immersive.peek .topbar { opacity: 1; transition: opacity .2s; }
  .where b { display: block; font: 500 20px/1.15 var(--en); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where span { display: block; font-size: 12px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* voice scene: title, live caption, controls */
  .vstage { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto;
    padding: calc(76px + var(--safe-t)) 20px 0; }
  .vstage .head { text-align: center; }
  .kicker { font: 600 11px/1.4 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
  .vstage .title-h { font: 400 clamp(25px, 4vw, 42px)/1.35 var(--hi); margin-top: 10px; }
  .vstage .title-e { font: italic 400 clamp(19px, 2.2vw, 25px)/1.3 var(--en); color: var(--ink-soft); }
  .vstage .summary { max-width: 34rem; margin: 12px auto 0; font-size: 14px; color: var(--ink-faint); }
  .cap { align-self: center; text-align: center; max-width: 44rem; width: 100%; margin: 0 auto; transition: opacity .35s; }
  .cap .who { font: 600 10px/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--amber); margin-bottom: 12px; }
  .cap .h { font: 400 clamp(23px, 3vw, 34px)/1.5 var(--hi); }
  .cap .e { font: italic 400 clamp(18px, 2vw, 22px)/1.35 var(--en); color: var(--ink-soft); margin-top: 8px; }
  .cap.iv .who { color: var(--ink-faint); }
  .cap.iv .h { font-size: clamp(18px, 2.2vw, 23px); color: var(--ink-soft); }
  .cap.iv .e { font-size: clamp(16px, 1.6vw, 19px); color: var(--ink-faint); }

  .controls { display: flex; align-items: center; gap: 10px; padding: 12px 16px calc(14px + var(--safe-b));
    border-top: 1px solid var(--line); background: rgba(11,9,8,.92); margin: 0 -20px; }
  .cbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(243,237,226,.2); flex: none; }
  .cbtn.main { background: var(--ink); color: var(--bg); border-color: var(--ink); width: 52px; height: 52px; }
  .cbtn svg { width: 14px; height: 14px; fill: currentColor; }
  .cbtn:disabled { opacity: .3; cursor: default; }
  .track { position: relative; flex: 1; height: 44px; cursor: pointer; touch-action: none; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; top: 21px; height: 3px; border-radius: 2px; background: rgba(243,237,226,.15); }
  .track .fill { position: absolute; left: 0; top: 21px; height: 3px; border-radius: 2px; background: var(--amber); }
  .count { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill { font: 500 12px/1 var(--ui); padding: 11px 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-soft); flex: none; }

  /* transcript sheet (slides up from the bottom) */
  .tx { position: fixed; left: 0; right: 0; bottom: 0; height: 72vh; height: 72dvh; z-index: 20; background: var(--side);
    border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; transform: translateY(102%); transition: transform .3s ease;
    display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
  .tx.open { transform: none; box-shadow: 0 -20px 60px rgba(0,0,0,.5); }
  .tx .bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .tx h2 { font: 500 21px/1.2 var(--en); }
  .close { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); text-align: center; font-size: 15px; flex: none; }
  .tx .segs { overflow-y: auto; padding: 8px 8px calc(20px + var(--safe-b)); overscroll-behavior: contain; }
  .seg { display: grid; grid-template-columns: 42px 1fr; gap: 8px; padding: 10px 8px; border-radius: 8px; cursor: pointer; }
  .seg.now { background: var(--amber-soft); }
  .seg .t { font-size: 11px; color: var(--ink-faint); padding-top: 5px; font-variant-numeric: tabular-nums; }
  .seg .h { font: 400 17px/1.5 var(--hi); }
  .seg .e { font: italic 400 16px/1.3 var(--en); color: var(--ink-soft); }
  .seg.iv .h, .seg.iv .e { color: var(--ink-faint); font-size: 14px; }

  /* real photographs: behind a voice moment, the start and the end screens */
  .photo-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .photo-bg .blur { position: absolute; inset: -30px; background-size: cover; background-position: center;
    filter: blur(28px) brightness(.32) saturate(.7); transform: scale(1.1); }
  .photo-bg img { position: absolute; left: 50%; top: 50%; max-width: min(78vw, 640px); max-height: 62%;
    transform: translate(-50%, -50%); filter: brightness(.5) sepia(.15); border-radius: 3px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: photodrift 26s ease-in-out infinite alternate; }
  /* only the zoom is animated: an animated percentage translate is fixed at 0 while the image is still loading,
     which left the photo hanging off the bottom-right corner */
  @keyframes photodrift { from { scale: 1; } to { scale: 1.09; } }  /* never comes to rest */
  .start .photo-bg .lp.drift { animation: lpdrift 24s ease-in-out infinite alternate; transform-origin: 50% 50%; }
  @keyframes lpdrift { from { scale: 1; } to { scale: 1.04; } }
  .photo-tag { position: absolute; right: 14px; bottom: calc(86px + var(--safe-b)); z-index: 2; font: 500 10px/1.3 var(--ui);
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); padding: 5px 9px; border: 1px solid var(--line);
    border-radius: 999px; background: rgba(11,9,8,.6); max-width: 70vw; }
  .vstage > .head, .vstage > .cap, .vstage > .controls { position: relative; z-index: 1; }
  .cap .h, .cap .e, .vstage .title-h, .vstage .title-e { text-shadow: 0 2px 16px rgba(0,0,0,.85); }
  .start .photo-bg img, .end .photo-bg img { max-height: 70%; filter: brightness(.3) sepia(.2); }
  /* the landing picture (the four children) is meant to be seen: brighter, the title lifted off it with a shadow */
  .start.landing .photo-bg img { filter: brightness(.62) sepia(.08); }
  .start.landing > div:not(.photo-bg):not(.photo-tag) { text-shadow: 0 2px 18px rgba(0,0,0,.95), 0 0 4px rgba(0,0,0,.8); }
  .start > div:not(.photo-bg):not(.photo-tag), .end > div:not(.photo-bg):not(.photo-tag) { position: relative; z-index: 1; }
  /* Landing intro: the painting of the four children dissolves into the photo, then the camera finds each child
     in turn with their name, and settles on all four as the title fades in. Tap anywhere to skip. */
  .start > div:not(.photo-bg):not(.photo-tag) { transition: opacity 1.6s ease; }
  .start.intro > div:not(.photo-bg):not(.photo-tag) { opacity: 0; pointer-events: none; }
  .start .photo-bg .lp { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .start .photo-bg .lp img.pt, .start .photo-bg .lp img.ph { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    max-width: none; max-height: none; transform: none; animation: none; box-shadow: none; border-radius: 0;
    -webkit-mask-image: radial-gradient(farthest-side at 50% 46%, #000 26%, rgba(0,0,0,.86) 40%, rgba(0,0,0,.62) 54%, rgba(0,0,0,.38) 68%, rgba(0,0,0,.17) 82%, rgba(0,0,0,.05) 93%, transparent 100%);
            mask-image: radial-gradient(farthest-side at 50% 46%, #000 26%, rgba(0,0,0,.86) 40%, rgba(0,0,0,.62) 54%, rgba(0,0,0,.38) 68%, rgba(0,0,0,.17) 82%, rgba(0,0,0,.05) 93%, transparent 100%);
    transition: opacity 6s ease-in-out, filter 2s ease; }
  .start .photo-bg .lp img.pt { filter: brightness(.92); }
  /* the photo begins as a soft, out-of-focus black-and-white print and slowly comes into colour and focus */
  .start .photo-bg .lp { opacity: 0; transition: opacity 3s ease; }
  .start .photo-bg .lp.in { opacity: 1; }
  .start .photo-bg .lp img.pt { display: none; }
  /* soft black and white -> sharp black and white (held as long as possible) -> colour only at the very end */
  .start .photo-bg .lp img.ph { filter: grayscale(1) blur(8px) brightness(.72) contrast(.92) sepia(0) saturate(1);
    transition: filter 6s ease-out; }
  .start .photo-bg .lp.focus img.ph { filter: grayscale(1) blur(0) brightness(.9) contrast(1.04) sepia(0) saturate(1); }
  .start .photo-bg .lp.photo img.ph { filter: grayscale(0) blur(0) brightness(.95) contrast(1) sepia(.08) saturate(.85);
    transition: filter 4.5s ease-in-out; }
  .start .photo-bg .lp.dim img.ph { filter: grayscale(0) blur(0) brightness(.6) saturate(.8) sepia(.1) contrast(1); transition: filter 2.5s ease; }
  .start.landing .photo-bg .blur { filter: blur(48px) brightness(.24) saturate(.6); transition: filter 4.5s ease-in-out; }
  .start.landing .photo-bg.bw .blur { filter: blur(48px) brightness(.24) grayscale(1); }
  .start .lp-sound { position: absolute; left: max(16px, 4vw); bottom: calc(22px + var(--safe-b)); z-index: 7; pointer-events: auto;
    font: 500 11px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); cursor: pointer;
    background: rgba(11,9,8,.55); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; }
  .start .lp-sound[aria-pressed="true"] { color: var(--amber); }
  /* the spotlight: everything but one face softly blurred and dimmed; it glides from face to face */
  @property --sx { syntax: '<percentage>'; inherits: false; initial-value: 50%; }
  @property --sy { syntax: '<percentage>'; inherits: false; initial-value: 50%; }
  .start .photo-bg .lp .spot { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    -webkit-backdrop-filter: blur(5px) brightness(.5) saturate(.7); backdrop-filter: blur(5px) brightness(.5) saturate(.7);
    -webkit-mask-image: radial-gradient(circle at var(--sx) var(--sy), transparent 0, transparent var(--r0, 40px), #000 var(--r1, 110px));
            mask-image: radial-gradient(circle at var(--sx) var(--sy), transparent 0, transparent var(--r0, 40px), #000 var(--r1, 110px));
    transition: opacity 1.4s ease, --sx 1.8s ease-in-out, --sy 1.8s ease-in-out; }
  .start .photo-bg .lp .spot.on { opacity: 1; }
  .start .photo-bg .lp .lp-n { position: absolute; transform: translate(-50%, 6px); opacity: 0; text-align: center; white-space: nowrap;
    transition: opacity 1.2s ease, transform 1.2s ease; text-shadow: 0 2px 12px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9); }
  .start .photo-bg .lp .lp-n::before { content: ""; display: block; width: 1.5px; height: 18px; margin: 0 auto 6px;
    background: linear-gradient(rgba(240,214,174,0), var(--amber)); }
  .start .photo-bg .lp .lp-n b { font: 500 clamp(18px, 2.4vw, 30px)/1.1 var(--en); color: #f6f0e4; letter-spacing: .02em; }
  .start .photo-bg .lp .lp-n.show { opacity: 1; transform: translate(-50%, 0); }
  .start .lp-skip { position: absolute; left: 50%; bottom: calc(22px + var(--safe-b)); transform: translateX(-50%); z-index: 3;
    pointer-events: auto; font: 500 11px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint);
    background: rgba(11,9,8,.55); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  /* a moment with a photo: the photo sits above, Dad's words underneath it (never across his face) */
  .vstage.has-photo .photo-bg img { top: calc(41% + var(--safe-t) / 2); max-height: 34%; max-width: min(84vw, 520px); filter: brightness(.82) sepia(.12); }
  .vstage.has-photo .cap { align-self: end; padding-bottom: 18px; }
  .vstage.has-photo .summary { display: none; }
  .vstage.has-photo .photo-tag { left: 50%; right: auto; transform: translateX(-50%); bottom: auto;
    top: calc(58% + var(--safe-t) / 2 + 8px); white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  .start .photo-tag, .end .photo-tag { bottom: calc(16px + var(--safe-b)); }

  /* start screen */
  .start { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; text-align: center; padding: 80px 24px 40px;
    background: radial-gradient(ellipse at 50% 40%, rgba(46,34,22,.55), rgba(11,9,8,.97)), var(--bg); }
  .start h2 { font: 400 clamp(46px, 10vw, 76px)/1.2 var(--hi); }
  .start .en { font: italic 400 clamp(20px, 3vw, 28px)/1.3 var(--en); color: var(--ink-soft); }
  .start .by { font-size: 13px; color: var(--ink-faint); margin-top: 12px; }
  .start .go { margin-top: 32px; display: inline-flex; gap: 12px; align-items: center; padding: 17px 30px; border-radius: 999px; background: var(--ink); color: var(--bg);
    font: 600 13px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; }
  .start .go svg { width: 13px; height: 13px; fill: currentColor; }
  .start .resume { display: block; margin: 2px auto 0; font-size: 14px; color: var(--ink-soft); text-align: center; padding: 8px;
    text-decoration: underline; text-underline-offset: 3px; }

  /* end screen, after the last moment */
  .end { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; text-align: center; padding: 80px 24px 40px; background: var(--bg); }
  .end h2 { font: 400 clamp(30px, 6vw, 48px)/1.3 var(--hi); }
  .end .en { font: italic 400 clamp(19px, 2.6vw, 25px)/1.3 var(--en); color: var(--ink-soft); }
  .end .by { font-size: 13px; color: var(--ink-faint); margin-top: 12px; }
  .end .go { margin-top: 28px; display: inline-flex; gap: 12px; align-items: center; padding: 15px 26px; border-radius: 999px;
    border: 1px solid rgba(243,237,226,.35); font: 600 12px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; }

  /* ---------------- the menu slides in from the left ---------------- */
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .menu { position: fixed; top: 0; bottom: 0; left: 0; z-index: 31; width: min(400px, 88vw); background: var(--side);
    border-right: 1px solid var(--line); transform: translateX(-102%); transition: transform .3s ease; visibility: hidden;
    overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(30px + var(--safe-b)); }
  .menu.open { transform: none; visibility: visible; box-shadow: 20px 0 60px rgba(0,0,0,.5); }
  .menu header { position: sticky; top: 0; z-index: 2; background: var(--side); padding: calc(16px + var(--safe-t)) 18px 12px;
    border-bottom: 1px solid var(--line); }
  .menu .row { display: flex; align-items: center; justify-content: space-between; }
  .menu h1 { font: 500 32px/1.1 var(--en); }
  .menu .hi-sub { font: 400 17px/1.3 var(--hi); color: var(--ink-faint); }
  .people { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .chip { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--ink-faint); }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  button.chip { cursor: pointer; font: inherit; font-size: 14px; background: none; }
  button.chip:not(.on):hover { color: var(--ink); border-color: var(--ink-soft); }

  .decade h3 { font: 500 30px/1 var(--en); color: var(--ink-faint); padding: 24px 18px 8px 46px; }
  .list { position: relative; }
  .list::before { content: ""; position: absolute; left: 25px; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .item { position: relative; display: block; width: 100%; padding: 13px 16px 13px 46px; border-left: 3px solid transparent; }
  .item:active { background: rgba(243,237,226,.05); }
  .item.now { background: var(--amber-soft); border-left-color: var(--amber); }
  .item .dot { position: absolute; left: 20px; top: 19px; width: 11px; height: 11px; border-radius: 50%; background: var(--amber); }
  .item.approx .dot { background: var(--side); border: 1.5px dashed var(--amber); }
  .item.unknown .dot { background: var(--side); border: 1.5px dotted var(--ink-faint); }
  .item.now .dot { box-shadow: 0 0 0 4px rgba(217,164,91,.25); }
  .item .when { font: 600 13px/1 var(--ui); letter-spacing: .06em; color: var(--ink-faint); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .item .h { font: 400 21px/1.45 var(--hi); margin-top: 7px; }
  .item .e { font: 500 19px/1.3 var(--en); color: var(--ink-soft); }
  .kind { font: 600 9px/1 var(--ui); letter-spacing: .12em; padding: 3px 6px; border-radius: 3px; }
  .kind.story { background: var(--amber); color: #1b130a; }
  .kind.soon { border: 1px solid currentColor; opacity: .8; }
  .item.soon { opacity: .42; cursor: default; }
  .item.soon:hover { background: none; }

  /* small screens */
  @media (max-width: 640px) {
    .vstage { padding: calc(70px + var(--safe-t)) 16px 0; }
    .vstage .summary { display: none; }
    .controls { gap: 8px; padding-left: 12px; padding-right: 12px; margin: 0 -16px; }
    .cbtn { width: 42px; height: 42px; }
    .count { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .menu, .scrim, .tx { transition: none; } }
</style>
</head>
<body>
<main class="stage" id="stage">
  <iframe id="frame" title="Story" allow="autoplay; fullscreen" hidden></iframe>

  <section class="vstage" id="voice" hidden>
    <div class="photo-bg" id="vPhoto" hidden></div>
    <div class="photo-tag" id="vPhotoTag" hidden></div>
    <div class="head">
      <div class="kicker" id="vKicker"></div>
      <div class="title-h" id="vTitleH"></div>
      <div class="title-e" id="vTitleE"></div>
      <p class="summary" id="vSummary"></p>
    </div>
    <div class="cap" id="vCap"></div>
    <div class="controls">
      <button class="cbtn" id="prev" aria-label="Previous moment"><svg viewBox="0 0 14 14"><path d="M3 1h2v12H3zM13 1v12L5 7z"/></svg></button>
      <button class="cbtn main" id="pp" aria-label="Play or pause"><svg id="ppIcon" viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z"/></svg></button>
      <button class="cbtn" id="next" aria-label="Next moment"><svg viewBox="0 0 14 14"><path d="M9 1h2v12H9zM1 1v12l8-6z"/></svg></button>
      <div class="track" id="track"><div class="fill" id="fill"></div></div>
      <span class="count" id="count"></span>
      <button class="pill" id="txBtn">Transcript</button>
    </div>
  </section>

  <div class="start" id="start">
    <div class="photo-bg" id="startPhoto" hidden></div>
    <div class="photo-tag" id="startPhotoTag" hidden></div>
    <div>
      <h2>हम लोग</h2>
      <div class="en" id="startWho">Dad, in his own voice</div>
      <div class="by" id="startBy"></div>
      <button class="go" id="go"><svg viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z"/></svg>Play from the beginning</button>
      <button class="resume" id="resume" hidden></button>
    </div>
  </div>

  <div class="end" id="end" hidden>
    <div class="photo-bg" id="endPhoto" hidden></div>
    <div class="photo-tag" id="endPhotoTag" hidden></div>
    <div>
      <h2>अभी के लिए बस इतना</h2>
      <div class="en">That's all for now</div>
      <div class="by">More of Dad's stories, and Mum's and Dadi's, are on their way.</div>
      <button class="go" id="again">Start again</button>
    </div>
  </div>

  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Open the timeline" aria-controls="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="where" id="where"><b>Humlog</b><span>हम लोग</span></div>
    <button class="fs-btn" id="fsBtn" aria-label="Full screen"><svg id="fsIcon" viewBox="0 0 24 24"></svg></button>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<nav class="menu" id="menu" aria-label="Timeline">
  <header>
    <div class="row">
      <div><h1>Humlog</h1><div class="hi-sub">हम लोग</div></div>
      <button class="close" id="menuClose" aria-label="Close the timeline">✕</button>
    </div>
    <div class="people" id="people"></div>
  </header>
  <div id="timeline"></div>
</nav>

<aside class="tx" id="tx" aria-label="Transcript">
  <div class="bar"><h2 id="txTitle">Transcript</h2><button class="close" id="txClose" aria-label="Close">✕</button></div>
  <div class="segs" id="txSegs"></div>
</aside>

<audio id="audio" preload="none"></audio>
<script src="data.js"></script>
<script>
(() => {
  const A = window.ARCHIVE, $ = id => document.getElementById(id);
  const audio = $("audio"), frame = $("frame"), menu = $("menu"), scrim = $("scrim");
  const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const mark = s => esc(s).replace(/\[\?(.+?)\?\]/g, '<span class="unclear" title="Unclear in the recording">$1</span>')
                          .replace(/\[अस्पष्ट\]/g, '<span class="unclear" title="Unclear in the recording">…</span>');
  const PLAY = '<path d="M2 1l11 6-11 6z"/>', PAUSE = '<path d="M2 1h3.5v12H2zM8.5 1H12v12H8.5z"/>';
  const recById = Object.fromEntries(A.recordings.map(r => [r.id, r]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  // ------------------------------------------------ moments, in date order
  // A story (film) stands in for the events it covers; every other event plays from its recording.
  // Moments without a story yet stay in the menu (greyed out, "story coming") but are not playable:
  // only stories are played, stepped through and auto-advanced.
  // Each person has their own timeline: Dad's (his stories and the moments still to come) or Mum's.
  const covered = new Set(A.chapters.flatMap(c => c.event_ids));
  const personOf = c => c.person || "dad";
  let who = "dad", listed = [], scenes = [], firstStory = -1;
  function buildScenes() {
    listed = [];
    if (who === "dad") A.events.forEach(e => { if (!covered.has(e.id) && e.sources?.length) listed.push({ kind: "voice", id: e.id, year: e.year, ev: e }); });
    A.chapters.filter(c => personOf(c) === who).forEach(c => listed.push({ kind: "story", id: c.id, year: c.year, ch: c }));
    listed.sort((a, b) => (a.year ?? 9999) - (b.year ?? 9999) || (a.kind === "story" ? -1 : 1));
    scenes = listed.filter(s => s.kind === "story");
    firstStory = scenes.length ? 0 : -1; // "the beginning" = the first story
  }
  const sceneIndex = id => scenes.findIndex(s => s.id === id);
  const whenText = (year, basis, yearEnd) => !year ? "Date not known"
    : (basis === "stated" ? "" : "c. ") + year + (yearEnd && yearEnd !== year ? "–" + yearEnd : "");
  const titleHi = s => s.kind === "story" ? s.ch.title_hi : s.ev.title_hi;
  const titleEn = s => s.kind === "story" ? s.ch.title_en : s.ev.title_en;

  // ------------------------------------------------ menu
  function renderMenu() {
  $("people").innerHTML = A.people.map(p => p.status === "recorded"
    ? `<button class="chip ${p.id === who ? "on" : ""}" data-who="${esc(p.id)}">${esc(p.name_en)}</button>`
    : `<span class="chip">${esc(p.name_en)} · soon</span>`).join("");
  const byDecade = {};
  listed.forEach(s => { const d = s.year ? Math.floor(s.year / 10) * 10 + "s" : "Date not known"; (byDecade[d] ||= []).push(s); });
  $("timeline").innerHTML = Object.entries(byDecade).map(([dec, items]) => `<section class="decade"><h3>${dec}</h3><div class="list">${
    items.map(s => {
      if (s.kind === "story") {
        const c = s.ch;
        return `<button class="item" data-i="${scenes.indexOf(s)}"><span class="dot"></span>
          <div class="when">${esc(c.when)} <span class="kind story">STORY · ${fmt(c.duration)}</span></div>
          <div class="h">${esc(c.title_hi)}</div><div class="e">${esc(c.title_en)}</div></button>`;
      }
      const e = s.ev, cls = e.date_basis === "stated" ? "" : (e.year ? "approx" : "unknown");
      return `<div class="item soon ${cls}" aria-disabled="true" title="Story coming"><span class="dot"></span>
        <div class="when">${whenText(e.year, e.date_basis, e.year_end)} <span class="kind soon">STORY COMING</span></div>
        <div class="h">${esc(e.title_hi)}</div><div class="e">${esc(e.title_en)}</div></div>`;
    }).join("")}</div></section>`).join("");
  }
  // real photographs
  const photoById = Object.fromEntries((A.photos || []).map(p => [p.id, p]));
  const photoTag = p => `Photograph · ${p.date}${p.edits && p.edits !== "unedited" ? " · " + p.edits.split(",").slice(-2)[0].trim() : ""}`;
  function showPhoto(slot, tag, p) {
    if (!p) { $(slot).hidden = true; $(tag).hidden = true; return; }
    $(slot).innerHTML = `<div class="blur" style="background-image:url('${esc(p.url)}')"></div><img src="${esc(p.url)}" alt="${esc(p.caption)}">`;
    $(tag).textContent = photoTag(p);
    $(slot).hidden = false; $(tag).hidden = false;
  }
  const usePhoto = use => (A.photos || []).find(p => (p.use || []).includes(use));
  // each person's start and end photos are chosen in the private photo list ("use": ["start-mum"], ...)
  // the site opens on the four children ("landing"); once a person is chosen, their own photo
  let landing = true;
  const startPhotoFor = () => (landing && usePhoto("landing")) || usePhoto(who === "dad" ? "start" : "start-" + who) || usePhoto("start");
  const endPhotoFor = () => usePhoto(who === "dad" ? "end" : "end-" + who) || usePhoto("end");

  function openMenu() {
    menu.classList.add("open"); scrim.classList.add("show"); $("menuBtn").setAttribute("aria-expanded", "true");
    menu.querySelector(".item.now")?.scrollIntoView({ block: "center" });
    $("menuClose").focus({ preventScroll: true });
  }
  function closeMenu() {
    if (!menu.classList.contains("open")) return;
    menu.classList.remove("open"); scrim.classList.remove("show"); $("menuBtn").setAttribute("aria-expanded", "false");
  }
  $("menuBtn").onclick = openMenu; $("menuClose").onclick = closeMenu; scrim.onclick = closeMenu;
  let sx = null; // swipe left to close
  menu.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  menu.addEventListener("touchend", e => { if (sx !== null && sx - e.changedTouches[0].clientX > 60) closeMenu(); sx = null; });

  // ------------------------------------------------ full screen
  // Real full screen where the browser allows it; on iPhone (no page full screen) an immersive mode.
  const root = document.documentElement;
  const canFS = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const isFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement) || document.body.classList.contains("immersive");
  const ICON_IN = '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>', ICON_OUT = '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>';
  const syncFS = () => { $("fsIcon").innerHTML = isFS() ? ICON_OUT : ICON_IN; $("fsBtn").setAttribute("aria-label", isFS() ? "Exit full screen" : "Full screen"); };
  function enterFS() {
    if (isFS()) return;
    if (canFS) (root.requestFullscreen || root.webkitRequestFullscreen).call(root)?.catch?.(() => {});
    else document.body.classList.add("immersive");
    syncFS();
  }
  function exitFS() {
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    document.body.classList.remove("immersive", "peek");
    syncFS();
  }
  $("fsBtn").onclick = () => isFS() ? exitFS() : enterFS();
  document.addEventListener("fullscreenchange", syncFS); document.addEventListener("webkitfullscreenchange", syncFS);
  let peekTimer; // in immersive mode, a tap brings the top bar back for a few seconds
  document.addEventListener("pointerdown", () => {
    if (!document.body.classList.contains("immersive")) return;
    document.body.classList.add("peek"); clearTimeout(peekTimer);
    peekTimer = setTimeout(() => document.body.classList.remove("peek"), 3000);
  });
  syncFS();

  // ------------------------------------------------ playback
  let current = -1, passage = null, autoNext = true, lineIdx = -1;

  const highlight = sel => {
    menu.querySelectorAll(".item").forEach(el => el.classList.remove("now"));
    if (sel) menu.querySelector(sel)?.classList.add("now");
  };
  const setWhere = (title, sub) => { $("where").innerHTML = `<b>${esc(title)}</b><span>${esc(sub)}</span>`; };
  function stopAll() {
    audio.pause();
    try { frame.contentWindow?.postMessage({ cmd: "pause" }, location.origin); } catch (e) {}
  }

  function playScene(i) {
    stopLandingMusic(1200);  // the landing cello steps aside for the story
    if (i < 0 || i >= scenes.length) return;
    stopAll(); closeMenu(); $("tx").classList.remove("open");
    current = i; autoNext = true;
    $("start").hidden = true; $("end").hidden = true;
    const s = scenes[i];
    highlight(`.item[data-i="${i}"]`);
    setWhere(titleHi(s), `${i + 1} of ${scenes.length} · ${titleEn(s)}`);
    history.replaceState(null, "", "#" + s.id);
    store.set("lastScene", s.id);
    if (s.kind === "story") {
      $("voice").hidden = true; frame.hidden = false;
      const url = s.ch.url + "?embed=1&autoplay=1&v=" + (A.version || "");
      if (frame.dataset.url === url) frame.contentWindow.postMessage({ cmd: "restart" }, location.origin);
      else { frame.dataset.url = url; frame.src = url; }
    } else {
      const e = s.ev, src = e.sources[0];
      showVoice(recById[src.recording], src.start, src.end, {
        kicker: [whenText(e.year, e.date_basis, e.year_end), ...(e.places || [])].join(" · "),
        h: e.title_hi, e: e.title_en, summary: e.summary_en, photo: photoById[(e.photos || [])[0]] });
    }
    $("prev").disabled = i === 0; $("next").disabled = i === scenes.length - 1;
    $("count").textContent = `${i + 1} / ${scenes.length}`;
  }

  function showVoice(rec, start, end, head, open = false) {
    frame.hidden = true; $("voice").hidden = false;
    $("vKicker").textContent = head.kicker || "";
    $("vTitleH").textContent = head.h || ""; $("vTitleE").textContent = head.e || "";
    $("vSummary").textContent = head.summary || "";
    showPhoto("vPhoto", "vPhotoTag", head.photo);
    $("voice").classList.toggle("has-photo", !!head.photo);
    $("vCap").innerHTML = ""; $("fill").style.width = "0";
    passage = { rec, start, end, open }; lineIdx = -1;
    if (!audio.src.endsWith(rec.file)) audio.src = rec.file;
    const go = () => { audio.currentTime = Math.max(start - 0.3, 0); audio.play().catch(() => {}); };
    audio.readyState >= 1 ? go() : (audio.addEventListener("loadedmetadata", go, { once: true }), audio.load());
  }

  function next() {
    if (!autoNext || current < 0) return;
    if (current < scenes.length - 1) return playScene(current + 1);
    // after the last moment: a quiet closing screen with Dad today
    stopAll(); $("end").hidden = false; highlight(null); setWhere("Humlog", "हम लोग");
    showPhoto("endPhoto", "endPhotoTag", endPhotoFor());
  }
  $("again").onclick = () => { $("end").hidden = true; playScene(firstStory >= 0 ? firstStory : 0); };

  menu.addEventListener("click", ev => {
    const it = ev.target.closest(".item"); if (it && !it.classList.contains("soon")) { enterFS(); playScene(+it.dataset.i); }
  });

  $("pp").onclick = () => audio.paused ? audio.play() : audio.pause();
  $("prev").onclick = () => playScene(current - 1);
  $("next").onclick = () => playScene(current + 1);
  audio.addEventListener("play", () => $("ppIcon").innerHTML = PAUSE);
  audio.addEventListener("pause", () => $("ppIcon").innerHTML = PLAY);

  // seek by tap or drag
  const seekTo = x => {
    if (!passage) return;
    const b = $("track").getBoundingClientRect(), k = Math.min(1, Math.max(0, (x - b.left) / b.width));
    audio.currentTime = passage.start + k * (passage.end - passage.start);
  };
  $("track").addEventListener("pointerdown", e => { $("track").setPointerCapture(e.pointerId); seekTo(e.clientX); });
  $("track").addEventListener("pointermove", e => { if (e.buttons) seekTo(e.clientX); });

  audio.addEventListener("timeupdate", () => {
    if (!passage) return;
    const t = audio.currentTime, p = passage, len = p.end - p.start;
    if (!p.open && t > p.end + 0.6) { audio.pause(); passage = { ...p, open: true }; setTimeout(next, 1800); return; }
    $("fill").style.width = Math.min(100, Math.max(0, (t - p.start) / len * 100)) + "%";
    const i = p.rec.segments.findIndex(s => t >= s.start && t < s.end + 0.4);
    if (i >= 0 && i !== lineIdx) {
      lineIdx = i; const s = p.rec.segments[i], cap = $("vCap");
      cap.style.opacity = 0;
      setTimeout(() => {
        cap.className = "cap" + (s.speaker === "DAD" ? "" : " iv");
        cap.innerHTML = `<div class="who">${s.speaker === "DAD" ? "Dad" : "Question"}</div>
          <div class="h">${mark(s.text_hi)}</div><div class="e">${mark(s.text_en)}</div>`;
        cap.style.opacity = 1;
      }, 180);
      $("txSegs").querySelectorAll(".seg").forEach(el => {
        const on = +el.dataset.i === i; el.classList.toggle("now", on);
        if (on && $("tx").classList.contains("open")) el.scrollIntoView({ block: "center", behavior: "smooth" });
      });
    }
  });
  audio.addEventListener("ended", () => { if (passage?.open && current >= 0) next(); });

  // transcript sheet
  $("txBtn").onclick = () => {
    if (!passage) return;
    const r = passage.rec;
    $("txTitle").textContent = r.title + " · transcript";
    $("txSegs").innerHTML = r.segments.map((s, i) => `<div class="seg ${s.speaker === "DAD" ? "" : "iv"}" data-i="${i}">
      <div class="t">${fmt(s.start)}</div><div><div class="h">${mark(s.text_hi)}</div><div class="e">${mark(s.text_en)}</div></div></div>`).join("");
    $("txSegs").querySelectorAll(".seg").forEach(el => el.onclick = () => {
      passage = { ...passage, open: true }; autoNext = false; audio.currentTime = r.segments[+el.dataset.i].start; audio.play();
    });
    lineIdx = -1;
    $("tx").classList.add("open");
  };
  $("txClose").onclick = () => $("tx").classList.remove("open");

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeMenu(); $("tx").classList.remove("open"); document.body.classList.remove("immersive", "peek"); syncFS(); }
    if (e.key === " " && !$("voice").hidden && e.target === document.body) { e.preventDefault(); $("pp").click(); }
  });

  // an embedded story tells us when it has finished
  window.addEventListener("message", ev => {
    if (ev.origin !== location.origin) return;
    if (ev.data?.type === "chapter-ended") setTimeout(next, 1500);
  });

  // ------------------------------------------------ start screen (per person)
  $("go").onclick = () => { enterFS(); playScene(firstStory >= 0 ? firstStory : 0); };
  // ---- landing intro: from black, a soft black-and-white print slowly comes into colour and focus while the
  // camera moves closer; the names fade in and out; then the title. A quiet solo cello plays underneath.
  let introTimers = [], introFinish = null;
  function stopIntro() { introTimers.forEach(clearTimeout); introTimers = []; introFinish = null; $("start").classList.remove("intro"); }

  // The cello: browsers only allow sound after the visitor has tapped or clicked, so if it cannot start by itself
  // it starts on the first tap; the Sound button turns it on and off; it fades out when a story starts.
  const landingMusic = A.landingMusic ? Object.assign(new Audio(A.landingMusic), { loop: true, volume: 0 }) : null;
  let musicWanted = true, musicFade = null;
  const fadeMusic = (to, ms, then) => {
    clearInterval(musicFade); const from = landingMusic.volume, t0 = performance.now();
    musicFade = setInterval(() => {
      const k = Math.min((performance.now() - t0) / ms, 1); landingMusic.volume = from + (to - from) * k;
      if (k >= 1) { clearInterval(musicFade); if (then) then(); }
    }, 50);
  };
  const soundBtn = () => $("start").querySelector(".lp-sound");
  const markSound = on => { const b = soundBtn(); if (b) { b.setAttribute("aria-pressed", on); b.textContent = on ? "♪ Sound on" : "♪ Sound off"; } };
  function startLandingMusic() {
    if (!landingMusic || !musicWanted || !$("start").classList.contains("landing")) return;
    landingMusic.play().then(() => { fadeMusic(0.55, 3500); markSound(true); }).catch(() => markSound(false));
  }
  function stopLandingMusic(ms = 1500) {
    if (landingMusic && !landingMusic.paused) fadeMusic(0, ms, () => landingMusic.pause());
    markSound(false);
  }
  addEventListener("pointerdown", ev => {
    if (ev.target.closest(".lp-sound, .go, .resume")) return;
    if (landingMusic && landingMusic.paused && musicWanted) startLandingMusic();
  }, { capture: true });

  function landingIntro(p) {
    const slot = $("startPhoto"), faces = p.faces || [];
    slot.innerHTML = `<div class="blur" style="background-image:url('${esc(p.url)}')"></div><div class="lp">` +
      `<img class="ph" src="${esc(p.url)}" alt="${esc(p.caption)}">` +
      faces.map(f => `<div class="lp-n" style="left:${f.x * 100}%;top:${(f.y + 0.12) * 100}%"><b>${esc(f.name)}</b></div>`).join("") +
      `</div><button class="lp-skip" type="button">Skip intro</button>`;
    $("startPhotoTag").textContent = photoTag(p); slot.hidden = false; $("startPhotoTag").hidden = false;
    slot.classList.add("bw");
    if (landingMusic && !soundBtn()) {
      $("start").insertAdjacentHTML("beforeend", '<button class="lp-sound" type="button" aria-pressed="false">♪ Sound off</button>');
      soundBtn().onclick = ev => {
        ev.stopPropagation();
        musicWanted = landingMusic.paused;
        if (musicWanted) startLandingMusic(); else stopLandingMusic(600);
      };
    }
    const lp = slot.querySelector(".lp"), ph = slot.querySelector(".ph");
    const names = [...slot.querySelectorAll(".lp-n")];
    const box = () => {
      const sw = slot.clientWidth, sh = slot.clientHeight, ar = (ph.naturalWidth / ph.naturalHeight) || 1.54;
      let w = Math.min(sw * 0.98, 1250), h = w / ar;
      if (h > sh * 0.86) { h = sh * 0.86; w = h * ar; }
      lp.style.width = w + "px"; lp.style.height = h + "px";
      return { sw, sh, w, h };
    };
    // px translate + scale only (an animated % translate misplaces images that are still loading)
    let aim = { sc: 1, until: 0 };  // where the camera is heading, and when it gets there
    const full = (ms, sc = 1, ease = "ease-in-out") => {
      const b = box();
      aim = { sc, until: performance.now() + ms };
      lp.style.transition = (ms ? `transform ${ms}ms ${ease}, ` : "") + "opacity 3s ease";
      lp.style.transform = `translate(${(b.sw - b.w * sc) / 2}px, ${(b.sh - b.h * sc) / 2}px) scale(${sc})`;
    };
    // if the screen area changes size (a browser bar appears, a phone's address bar slides away), glide the photo
    // to its new centre straight away, keeping the same move - instead of a jump when the intro ends
    if (window.ResizeObserver) {
      let first = true;
      new ResizeObserver(() => {
        if (first) { first = false; return; }
        if (!slot.contains(lp)) return;
        full(Math.max(aim.until - performance.now(), 700), aim.sc);
      }).observe(slot);
    }
    const T = (ms, fn) => introTimers.push(setTimeout(fn, ms));
    let zoomed = 1;
    introFinish = () => {
      stopIntro(); lp.classList.add("in", "focus", "photo", "dim"); slot.classList.remove("bw"); names.forEach(n => n.classList.remove("show"));
      const skip = slot.querySelector(".lp-skip"); if (skip) skip.remove();
      // then a slow drift in and out that never stops - the same centred camera move as the intro, so nothing jumps
      // (a separate "scale" drift would zoom about another point and shift the picture at the hand-over)
      let out = true;
      const breathe = () => { full(26000, out ? zoomed + 0.045 : zoomed); out = !out; T(26000, breathe); };
      full(1200, zoomed); T(1250, breathe);
    };
    full(0);
    startLandingMusic();
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { introFinish(); return; }
    $("start").classList.add("intro");
    const finish = introFinish;
    ph.decode().catch(() => {}).then(() => {
      if (introFinish !== finish) return;  // skipped or replaced meanwhile
      full(0);
      requestAnimationFrame(() => {
        lp.classList.add("in");                                        // out of the dark
        zoomed = 1.1; full(19000, zoomed);                             // the camera slowly moves closer
        T(1200, () => lp.classList.add("focus"));                      // the soft print sharpens, still black and white
        T(8000, () => names.forEach(n => n.classList.add("show")));    // the names, together
        T(12300, () => names.forEach(n => n.classList.remove("show")));
        T(13200, () => { lp.classList.add("photo"); slot.classList.remove("bw"); });  // only now does the colour come in (4.5 s)
        T(18500, () => { if (introFinish) introFinish(); });          // then the title
      });
    });
  }
  $("start").addEventListener("click", ev => { if (introFinish && !ev.target.closest(".go, .resume")) introFinish(); });
  addEventListener("keydown", () => introFinish && introFinish());
  // only a real change of shape (e.g. turning a phone) cuts the intro short; a phone's address bar sliding
  // away or a toolbar appearing also fires "resize", and must not skip it
  let introW = innerWidth;
  addEventListener("resize", () => { if (introFinish && Math.abs(innerWidth - introW) > 80) introFinish(); introW = innerWidth; });

  function showStart(linkedId) {
    const person = A.people.find(p => p.id === who);
    $("startWho").textContent = who === "mum" ? "Mum, in her own voice" : "Dad, in his own voice";
    const convs = new Set(A.chapters.filter(c => personOf(c) === who).map(c => c.recording)).size;
    $("startBy").textContent = `${scenes.length} ${scenes.length === 1 ? "story" : "stories"} from ${convs} ${convs === 1 ? "conversation" : "conversations"}`;
    stopIntro();
    const lpPhoto = landing && usePhoto("landing");
    if (lpPhoto) landingIntro(lpPhoto); else { $("startPhoto").classList.remove("bw"); showPhoto("startPhoto", "startPhotoTag", startPhotoFor()); stopLandingMusic(); }
    $("start").classList.toggle("landing", !!lpPhoto);
    if (lpPhoto) $("startWho").textContent = "A family's stories, in their own voices";
    // a shared link (#story-id) or where you left off last time
    const linked = sceneIndex(linkedId || "");
    const last = sceneIndex(store.get("lastScene") || "");
    const offer = linked >= 0 ? linked : (last > 0 ? last : -1);
    $("resume").hidden = offer < 0;
    if (offer >= 0) {
      $("resume").textContent = (linked >= 0 ? "Play the shared moment: " : "Continue where you left off: ") + titleEn(scenes[offer]);
      $("resume").onclick = () => { enterFS(); playScene(offer); };
    }
  }
  function setPerson(p, linkedId) {
    who = p; store.set("who", p);
    buildScenes(); renderMenu();
    stopAll(); current = -1; highlight(null); setWhere("Humlog", "हम लोग");
    frame.hidden = true; $("voice").hidden = true; $("end").hidden = true; $("start").hidden = false;
    showStart(linkedId);
  }
  $("people").addEventListener("click", ev => {
    const b = ev.target.closest("button.chip"); if (b && (b.dataset.who !== who || landing)) { landing = false; setPerson(b.dataset.who); }
  });
  // open on the person a shared link belongs to, else whoever was viewed last
  const hash = location.hash.slice(1), linkedCh = A.chapters.find(c => c.id === hash);
  const savedWho = store.get("who");
  setPerson(linkedCh ? personOf(linkedCh) : (A.people.some(p => p.id === savedWho && p.status === "recorded") ? savedWho : "dad"), hash);
})();
</script>
</body>
</html>
