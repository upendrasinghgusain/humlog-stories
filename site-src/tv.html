<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Humlog · Stories</title>
<!--
  TV version of Humlog Stories, for the parents' LG TV (webOS 4.5, an old Chromium).
  Served at /tv/stories/?key=... : Cloudflare skips the family login under /tv and checks the TV key
  on EVERY request, so every file this page loads gets ?key=... appended (same as Humlog's TV page).
  Old-style JavaScript only (var/function, no arrows, no modern syntax), no CSS grid, no maps:
  the story plays as its finished video; voice moments play as audio with captions.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0908; color: #f3ede2;
    font-family: "Tiro Devanagari Hindi", "Noto Sans Devanagari", sans-serif; cursor: none; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .hidden { display: none; }
  video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; }
  .center { position: absolute; left: 0; right: 0; top: 50%; text-align: center; transform: translateY(-50%); -webkit-transform: translateY(-50%); padding: 0 8%; }
  .photo { position: absolute; left: 50%; max-height: 42%; max-width: 50%; border-radius: 4px; box-shadow: 0 2vw 5vw rgba(0,0,0,.6); }
  .bgphoto { position: absolute; left: 50%; top: 50%; max-height: 80%; max-width: 70%; opacity: .28;
    transform: translate(-50%, -50%); -webkit-transform: translate(-50%, -50%); }
  .kicker { font-family: sans-serif; font-size: 1.6vw; letter-spacing: .3vw; text-transform: uppercase; color: #d9a45b; }
  .title { font-size: 4.2vw; line-height: 1.35; margin-top: 1vw; }
  .sub { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 2.6vw; color: rgba(243,237,226,.75); }
  .hint { font-family: sans-serif; font-size: 1.5vw; color: rgba(243,237,226,.6); margin-top: 3vw; }
  .ok { display: inline-block; margin-top: 3vw; padding: 1.2vw 3vw; border-radius: 4vw; background: #f3ede2; color: #0b0908;
    font-family: sans-serif; font-weight: bold; font-size: 1.6vw; letter-spacing: .2vw; }
  #vTop { position: absolute; left: 0; right: 0; top: 5%; text-align: center; padding: 0 8%; }
  #vTop .title { font-size: 3.2vw; }
  #vTop .sub { font-size: 2.1vw; }
  #vCap { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; padding: 0 10%; }
  #vCap .who { font-family: sans-serif; font-size: 1.1vw; letter-spacing: .3vw; color: #d9a45b; margin-bottom: 1vw; }
  #vCap .h { font-size: 3.1vw; line-height: 1.45; text-shadow: 0 .2vw 1.5vw #000; }
  #vCap .e { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 2.2vw; color: rgba(243,237,226,.8); margin-top: .6vw; text-shadow: 0 .2vw 1.5vw #000; }
  #vCap.iv .who { color: rgba(243,237,226,.5); }
  #vCap.iv .h { font-size: 2.3vw; color: rgba(243,237,226,.7); }
  #vCap.iv .e { font-size: 1.8vw; color: rgba(243,237,226,.5); }
  .tag { position: absolute; right: 3%; bottom: 4%; font-family: sans-serif; font-size: 1vw; letter-spacing: .1vw; color: rgba(243,237,226,.5); text-transform: uppercase; }
  #bar { position: absolute; left: 0; bottom: 0; height: .5vw; background: #d9a45b; width: 0; }
  #count { position: absolute; left: 3%; bottom: 4%; font-family: sans-serif; font-size: 1.2vw; color: rgba(243,237,226,.5); }
  #badge { position: absolute; left: 3%; top: 5%; font-family: sans-serif; font-size: 1.6vw; padding: .8vw 1.6vw; border-radius: 3vw;
    background: rgba(0,0,0,.65); color: #f3ede2; }
  .unclear { border-bottom: .15vw dotted #d9a45b; }

  /* menu: the timeline, on the left, operated with the remote */
  #menu { position: absolute; left: 0; top: 0; bottom: 0; width: 44%; background: #15120f; z-index: 10;
    border-right: .15vw solid rgba(243,237,226,.1); box-shadow: 3vw 0 6vw rgba(0,0,0,.6); }
  .mhead { padding: 3vw 3vw 1.5vw; border-bottom: .1vw solid rgba(243,237,226,.1); }
  .mtitle { font-size: 3vw; }
  .mhint { font-family: sans-serif; font-size: 1.1vw; color: rgba(243,237,226,.55); margin-top: .5vw; }
  #mlist { position: absolute; left: 0; right: 0; top: 9.5vw; bottom: 0; overflow-y: auto; padding-bottom: 6vw; }
  .dec { font-family: "Cormorant Garamond", Georgia, serif; font-size: 2.6vw; color: rgba(243,237,226,.45); padding: 1.8vw 3vw .4vw; }
  .mi { padding: 1vw 3vw 1vw 2.6vw; border-left: .4vw solid transparent; }
  .mi.now .mw { color: #d9a45b; }
  .mi.focus { background: rgba(217,164,91,.2); border-left-color: #d9a45b; }
  .mw { font-family: sans-serif; font-size: 1.1vw; letter-spacing: .08vw; color: rgba(243,237,226,.55); }
  .st { font-size: .8vw; font-weight: bold; padding: .15vw .4vw; border-radius: .2vw; background: #d9a45b; color: #1b130a; margin-left: .5vw; }
  .mh { font-size: 2.1vw; line-height: 1.45; margin-top: .3vw; }
  .me { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.7vw; color: rgba(243,237,226,.72); }
</style>
</head>
<body>

<video id="video" class="hidden" preload="auto" playsinline></video>
<audio id="audio" preload="auto"></audio>

<div id="voice" class="layer hidden">
  <img id="vPhoto" class="photo hidden" alt="">
  <div id="vTop"><div class="kicker" id="vKicker"></div><div class="title" id="vTitle"></div><div class="sub" id="vSub"></div></div>
  <div id="vCap"></div>
  <div class="tag" id="vTag"></div>
  <div id="bar"></div>
</div>

<div id="start" class="layer">
  <img id="startPhoto" class="bgphoto hidden" alt="">
  <div class="center">
    <div class="title" style="font-size:7vw">हम लोग</div>
    <div class="sub">Dad, in his own voice</div>
    <div class="ok">OK &nbsp;▶&nbsp; PLAY</div>
    <div class="hint">▲ menu &nbsp;·&nbsp; ◀ ▶ previous / next &nbsp;·&nbsp; OK pause</div>
  </div>
</div>

<div id="end" class="layer hidden">
  <img id="endPhoto" class="bgphoto hidden" alt="">
  <div class="center">
    <div class="title">अभी के लिए बस इतना</div>
    <div class="sub">That's all for now</div>
    <div class="ok">OK &nbsp;▶&nbsp; START AGAIN</div>
  </div>
</div>

<div id="menu" class="hidden">
  <div class="mhead"><div class="mtitle">हम लोग</div><div class="mhint">▲ ▼ choose &nbsp;·&nbsp; OK play &nbsp;·&nbsp; ◀ close</div></div>
  <div id="mlist"></div>
</div>

<div id="count"></div>
<div id="badge" class="hidden"></div>

<script>
  var KEY_QUERY = (function () {
    var m = /[?&]key=([^&#]+)/.exec(location.search);
    return m ? 'key=' + m[1] : '';
  })();
  function withKey(url) { return KEY_QUERY ? url + (url.indexOf('?') < 0 ? '?' : '&') + KEY_QUERY : url; }
  document.write('<script src="' + withKey('data.js') + '"><\/script>');
</script>
<script>
(function () {
  var A = window.ARCHIVE;
  function $(id) { return document.getElementById(id); }
  var video = $('video'), audio = $('audio');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function mark(s) {
    return esc(s).replace(/\[\?(.+?)\?\]/g, '<span class="unclear">$1</span>').replace(/\[अस्पष्ट\]/g, '<span class="unclear">…</span>');
  }
  function show(el, on) { el.className = el.className.replace(/\s*hidden/g, '') + (on ? '' : ' hidden'); }
  function find(list, fn) { for (var i = 0; i < list.length; i++) if (fn(list[i])) return list[i]; return null; }
  function photoBy(id) { return find(A.photos || [], function (p) { return p.id === id; }); }
  function photoFor(use) { return find(A.photos || [], function (p) { return (p.use || []).indexOf(use) >= 0; }); }
  function setPhoto(img, p) { if (p) { img.src = withKey(p.url); show(img, true); } else show(img, false); }

  // ---- moments in date order (a story stands in for the events it covers), as on the main site
  var covered = {};
  A.chapters.forEach(function (c) { c.event_ids.forEach(function (id) { covered[id] = true; }); });
  var scenes = [];
  A.events.forEach(function (e) { if (!covered[e.id] && e.sources && e.sources.length) scenes.push({ kind: 'voice', year: e.year, ev: e }); });
  A.chapters.forEach(function (c) { if (c.video) scenes.push({ kind: 'story', year: c.year, ch: c }); });
  scenes.sort(function (a, b) { return ((a.year || 9999) - (b.year || 9999)) || (a.kind === 'story' ? -1 : 1); });
  var firstStory = 0;
  for (var i = 0; i < scenes.length; i++) if (scenes[i].kind === 'story') { firstStory = i; break; }
  var recById = {};
  A.recordings.forEach(function (r) { recById[r.id] = r; });

  setPhoto($('startPhoto'), photoFor('start'));

  // ---- playback
  var current = -1, passage = null, mode = 'start', nextTimer = null, lineIdx = -1;

  function whenText(e) {
    if (!e.year) return '';
    return (e.date_basis === 'stated' ? '' : 'c. ') + e.year + (e.year_end && e.year_end !== e.year ? '–' + e.year_end : '');
  }
  function stopAll() {
    clearTimeout(nextTimer);
    try { video.pause(); } catch (x) {}
    try { audio.pause(); } catch (x) {}
    passage = null;
  }
  function badge(text) {
    var b = $('badge'); b.innerHTML = text; show(b, true);
    clearTimeout(badge.t); badge.t = setTimeout(function () { show(b, false); }, 2500);
  }

  function play(i) {
    if (i < 0 || i >= scenes.length) return;
    stopAll();
    current = i; mode = 'playing';
    show($('start'), false); show($('end'), false);
    $('count').innerHTML = (i + 1) + ' / ' + scenes.length + ' &nbsp;·&nbsp; ▲ menu';
    var s = scenes[i];
    if (s.kind === 'story') {
      show($('voice'), false); show(video, true);
      video.src = withKey(s.ch.video);
      video.load(); video.play();
    } else {
      show(video, false); show($('voice'), true);
      var e = s.ev, src = e.sources[0], r = recById[src.recording];
      $('vKicker').innerHTML = esc([whenText(e)].concat(e.places || []).join(' · '));
      $('vTitle').innerHTML = esc(e.title_hi);
      $('vSub').innerHTML = esc(e.title_en);
      $('vCap').innerHTML = ''; $('bar').style.width = '0';
      var p = photoBy((e.photos || [])[0]);
      setPhoto($('vPhoto'), p);
      $('vPhoto').style.top = '27%';
      $('vPhoto').style.webkitTransform = $('vPhoto').style.transform = 'translateX(-50%)';
      $('vTag').innerHTML = p ? esc('Photograph · ' + p.date) : 'From the interview · AI transcript, not yet checked';
      passage = { rec: r, start: src.start, end: src.end };
      lineIdx = -1;
      var url = withKey(r.file);
      var go = function () { try { audio.currentTime = Math.max(src.start - 0.3, 0); } catch (x) {} audio.play(); };
      if (audio.getAttribute('data-src') !== url) {
        audio.setAttribute('data-src', url); audio.src = url;
        audio.addEventListener('loadedmetadata', function once() { audio.removeEventListener('loadedmetadata', once); go(); });
        audio.load();
      } else go();
    }
  }
  function next() {
    if (current < scenes.length - 1) return play(current + 1);
    stopAll(); mode = 'end';
    show(video, false); show($('voice'), false); show($('end'), true);
    setPhoto($('endPhoto'), photoFor('end'));
    $('count').innerHTML = '';
  }
  function togglePause() {
    var el = (scenes[current] && scenes[current].kind === 'story') ? video : audio;
    if (el.paused) { el.play(); badge('▶'); } else { el.pause(); badge('❚❚ Paused'); }
  }

  video.addEventListener('ended', function () { nextTimer = setTimeout(next, 1200); });
  audio.addEventListener('timeupdate', function () {
    if (!passage) return;
    var t = audio.currentTime, p = passage;
    if (t > p.end + 0.6) { audio.pause(); passage = null; nextTimer = setTimeout(next, 1800); return; }
    $('bar').style.width = Math.max(0, Math.min(100, (t - p.start) / (p.end - p.start) * 100)) + '%';
    var segs = p.rec.segments;
    for (var i = 0; i < segs.length; i++) {
      if (t >= segs[i].start && t < segs[i].end + 0.4) {
        if (i !== lineIdx) {
          lineIdx = i;
          var s = segs[i], dad = s.speaker === 'DAD';
          $('vCap').className = dad ? '' : 'iv';
          $('vCap').innerHTML = '<div class="who">' + (dad ? 'DAD' : 'QUESTION') + '</div><div class="h">' + mark(s.text_hi) +
            '</div><div class="e">' + mark(s.text_en) + '</div>';
        }
        break;
      }
    }
  });

  // ---- the menu: the same timeline as the phone site, driven by the remote
  var menuOpen = false, focusIdx = 0, wasPlaying = false;
  (function buildMenu() {
    var html = '', lastDec = null;
    scenes.forEach(function (s, i) {
      var dec = s.year ? Math.floor(s.year / 10) * 10 + 's' : 'Date not known';
      if (dec !== lastDec) { html += '<div class="dec">' + dec + '</div>'; lastDec = dec; }
      var hi = s.kind === 'story' ? s.ch.title_hi : s.ev.title_hi;
      var en = s.kind === 'story' ? s.ch.title_en : s.ev.title_en;
      var when = s.kind === 'story' ? s.ch.when : whenText(s.ev);
      html += '<div class="mi" data-i="' + i + '"><div class="mw">' + esc(when) +
        (s.kind === 'story' ? ' <span class="st">STORY</span>' : '') + '</div><div class="mh">' + esc(hi) +
        '</div><div class="me">' + esc(en) + '</div></div>';
    });
    $('mlist').innerHTML = html;
  })();
  function menuItems() { return $('mlist').getElementsByClassName('mi'); }
  function focusItem(i) {
    var items = menuItems();
    focusIdx = Math.max(0, Math.min(items.length - 1, i));
    for (var j = 0; j < items.length; j++) {
      items[j].className = 'mi' + (j === focusIdx ? ' focus' : '') + (j === current ? ' now' : '');
    }
    // keep the highlighted item in view (old browsers: adjust scrollTop by hand)
    var box = $('mlist'), el = items[focusIdx];
    if (el.offsetTop - 120 < box.scrollTop) box.scrollTop = el.offsetTop - 120;
    else if (el.offsetTop + el.offsetHeight + 120 > box.scrollTop + box.clientHeight)
      box.scrollTop = el.offsetTop + el.offsetHeight + 120 - box.clientHeight;
  }
  function openMenu() {
    var el = (scenes[current] && scenes[current].kind === 'story') ? video : audio;
    wasPlaying = mode === 'playing' && !el.paused;
    if (wasPlaying) el.pause();
    menuOpen = true; show($('menu'), true);
    focusItem(current >= 0 ? current : firstStory);
  }
  function closeMenu(resume) {
    menuOpen = false; show($('menu'), false);
    if (resume && wasPlaying) {
      var el = (scenes[current] && scenes[current].kind === 'story') ? video : audio;
      el.play();
    }
  }

  // ---- remote control (codes as observed on the parents' LG, see Humlog docs/tv-remote.md)
  document.addEventListener('keydown', function (ev) {
    var k = ev.keyCode;
    var ok = k === 13 || k === 415 || k === 19 || k === 32;   // OK / Play / Pause / space
    if (menuOpen) {
      ev.preventDefault();
      if (k === 38) focusItem(focusIdx - 1);                 // Up
      else if (k === 40) focusItem(focusIdx + 1);            // Down
      else if (ok) { closeMenu(false); play(focusIdx); }     // OK: play the highlighted moment
      else if (k === 37 || k === 461) closeMenu(true);       // Left / Back: close, carry on
      return;
    }
    if (ok) {
      ev.preventDefault();
      if (mode === 'start' || mode === 'end') return play(firstStory);
      return togglePause();
    }
    if (k === 38 || k === 40) { ev.preventDefault(); openMenu(); return; }   // Up / Down: menu
    if (k === 39) { ev.preventDefault(); if (mode === 'playing') { badge('Next ▶'); next(); } return; }
    if (k === 37) { ev.preventDefault(); if (mode === 'playing' && current > 0) { badge('◀ Previous'); play(current - 1); } return; }
  });
  // the Magic Remote pointer: click a menu item to play it; elsewhere a click acts like OK
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    while (t && t !== document.body && !(t.className && /\bmi\b/.test(t.className))) t = t.parentNode;
    if (menuOpen) {
      if (t && t !== document.body) { closeMenu(false); play(+t.getAttribute('data-i')); }
      else closeMenu(true);
      return;
    }
    if (mode === 'playing') togglePause(); else play(firstStory);
  });
  document.addEventListener('mousemove', function (ev) {     // pointer hover moves the highlight
    if (!menuOpen) return;
    var t = ev.target;
    while (t && t !== document.body && !(t.className && /\bmi\b/.test(t.className))) t = t.parentNode;
    if (t && t !== document.body) { var i = +t.getAttribute('data-i'); if (i !== focusIdx) focusItem(i); }
  });
  window.focus();
})();
</script>
</body>
</html>
